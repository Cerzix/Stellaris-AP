l_russian:
 ap.20.name:0 "Archipelago"
 ap.20.desc:0 "§Y[Root.GetAPItemName]§! has arrived.\n\nSent by §Y[Root.GetAPSenderName]§!."
 ap.20.a:0 "Excellent."
 ap_item_unknown:0 "An item"
 ap_ascension_slots:0 "Progressive Ascension"
 ap_ascension_slots_desc:0 "Ascension perk slots received from the multiworld."
 ap_tradition_cost:0 "Archipelago Traditions"
 ap_tradition_cost_desc:0 "Traditions received from the multiworld make the next one more expensive."
 ap_loc_none:0 "Sends nothing: all tradition locations are in the first seven trees."
 ap_loc_none_name:0 "Archipelago Check"
 ap.100.name:0 "Archipelago"
 ap.100.desc:0 "Items received in this game: §Y[Root.ap_item_index]§!\nDooms suffered: §Y[Root.ap_doom_count]§!\n\nItems arrive while the game is not paused."
 ap.100.death:0 "Test: a death arrives from the multiworld."
 ap.100.doom:0 "Test: doom strikes one of our colonies now."
 ap.100.close:0 "Close."
 ap.10.name:0 "DeathLink: Doom"
 ap.10.desc:0 "Too many have died across the multiworld, and the debt has come due.\n\n§R[ap_doom_planet.GetName] has been destroyed.§! Nothing on its surface survived."
 ap.10.a:0 "They will be remembered."
 ap.11.name:0 "DeathLink: Doom Averted"
 ap.11.desc:0 "Too many have died across the multiworld, and doom came looking for a colony to claim.\n\nIt found only our capital, and passed us by."
 ap.11.a:0 "We may not be so lucky next time."
 ap.12.name:0 "DeathLink: A Death"
 ap.12.desc:0 "Someone has died in the multiworld. [Root.GetAPDeathEffect]\n\nDeaths: §R[Root.ap_death_count]§! of §R[Root.ap_death_goal]§!. When the count is full, doom comes for one of our colonies."
 ap.12.a:0 "Doom draws closer."
 ap.14.desc:0 "Someone has died in the multiworld. [Root.GetAPDeathEffect]"
 ap.14.a:0 "They will be remembered."
 ap_death_effect_0:0 " "
 ap_death_effect_1:0 "§ROne of our leaders died with them.§!"
 ap_death_effect_2:0 "§ROne of our fleets was lost with them.§!"
 ap_death_effect_3:0 "It found nothing of ours to take."
 ap.21.name:0 "Archipelago: Random Event"
 ap.21.desc:0 "[Root.GetAPEvent]"
 ap.21.a:0 "So be it."
 ap.22.desc:0 "The random events this run has received so far have struck again, each with a new outcome.\n\nOur empire starts with everything the run has received."
 ap_event_0:0 "Nothing happens."
 ap_event_1:0 "§GA windfall.§! A convoy nobody remembers ordering arrives with minerals and energy credits."
 ap_event_2:0 "§GA breakthrough.§! Our scientists see everything a little more clearly: research is faster for five years."
 ap_event_3:0 "§GA golden age.§! Our people are content: stability is higher for five years."
 ap_event_4:0 "§GFleet drills.§! Our gunners have never been sharper: ships fire faster for five years."
 ap_event_5:0 "§GA gift.§! Alloys, unity and influence, from an admirer who prefers not to be named."
 ap_event_6:0 "§RA market crash.§! Minerals and energy credits vanish from our accounts."
 ap_event_7:0 "§RA setback.§! A corrupted archive has to be rebuilt: research is slower for five years."
 ap_event_8:0 "§RUnrest.§! Our people are restless: stability is lower for five years."
 ap_event_9:0 "§RSabotage.§! Someone has been at our engines: ships are slower for five years."
 ap_event_10:0 "§RA fleet is lost.§! One of our fleets has vanished without a trace."
 ap_event_research_boom:0 "Breakthrough"
 ap_event_research_slump:0 "Research Setback"
 ap_event_golden_age:0 "Golden Age"
 ap_event_unrest:0 "Unrest"
 ap_event_fleet_drills:0 "Fleet Drills"
 ap_event_sabotage:0 "Sabotage"
 ap.13.name:0 "Archipelago: Another Run"
 ap.13.desc:0 "This save belongs to another run than the one that was picked in the launcher.\n\nNothing is sent or received. To go on with this save, close the game and pick its run in the launcher."
 ap.13.a:0 "Understood."
